name: Build

# عند كل push: اختبارات + APK للتجربة.
# عند الدمج في main (أو tag يبدأ بـ v): APK موقّع بمفتاح الإصدار المحفوظ في أسرار GitHub،
# ويُنشر كإصدار v<الرقم في version.txt> إن لم يكن منشوراً من قبل.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 37 (المثبّت مسبقاً في الـ runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(tr -d '[:space:]' < version.txt); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || { [[ "$GITHUB_REF" == refs/heads/main ]] && [[ "$GITHUB_EVENT_NAME" == push ]]; }; then RELEASE=true; fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Release signing key
        if: steps.ver.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            MSG="أسرار التوقيع غير موجودة (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD) — لن يُنشر إصدار"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::$MSG"; exit 1; fi
            echo "::warning::$MSG"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SIGNED=true" >> "$GITHUB_ENV"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Tests (core + Android adapter, parity with the Python tool)
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: SHA-1 of the signing certificate (for the Google OAuth client)
        id: cert
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          CERTS=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          SHA1=$(echo "$CERTS" | grep -m1 'SHA-1 digest' | awk '{print $NF}' | sed 's/../&:/g;s/:$//' | tr a-f A-F)
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "::notice title=SHA-1::$SHA1"
          {
            echo "### SHA-1 لمفتاح التوقيع"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "الـ package: \`com.modwahi.waarchiver\` — الإصدار ${{ steps.ver.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
          NAME="whatsapp-archiver-v${{ steps.ver.outputs.version }}.apk"
          cp "$APK" "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: ${{ steps.cert.outputs.apk }}

      - name: Already released?
        id: exists
        if: steps.ver.outputs.release == 'true' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::الإصدار v${{ steps.ver.outputs.version }} منشور مسبقاً — ارفع الرقم في version.txt لإصدار جديد"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release
        if: steps.ver.outputs.release == 'true' && env.SIGNED == 'true' && steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          files: ${{ steps.cert.outputs.apk }}
          body: |
            ## التثبيت
            افتح هذه الصفحة من التلفون، واضغط على ملف `${{ steps.cert.outputs.apk }}` لتنزيله، ثم افتحه واسمح بتثبيت التطبيقات من هذا المصدر.
            يُثبَّت فوق النسخة الموجودة، والإعدادات تبقى.

            - الـ package: `com.modwahi.waarchiver`
            - SHA-1 لمفتاح التوقيع (يُستخدم في OAuth client على Google Cloud): `${{ steps.cert.outputs.sha1 }}`

            خطوات الإعداد في [اقرأني.md](https://github.com/${{ github.repository }}/blob/main/اقرأني.md).
